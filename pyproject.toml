[project]
name = "smart-contract-vuln-scanner"
version = "0.1.0"
description = "Static analysis tool for detecting vulnerabilities in Solidity smart contracts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "typer>=0.15",
  "pydantic>=2.0",
  "py-solc-x>=2.0",
  "pyevmasm>=0.3",
  "rich>=13.0",
]

[project.scripts]
scanner = "scanner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["scanner"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["scanner"]
strict = false
warn_return_any = true
warn_unused_configs = true
