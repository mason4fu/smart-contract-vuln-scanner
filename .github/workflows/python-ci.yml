name: Python CI

on:
  push:
    branches: [master, main, "setup/**", "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Run tests
        run: uv run pytest

      - name: Fetch SWC Registry Subset
        run: uv run python scripts/fetch_swc_registry.py

      - name: Evaluate SWC Registry Subset
        run: uv run python scripts/evaluate_swc_registry.py

      - name: OOD Access-Control Guardrail
        run: uv run python scripts/check_ood_access_control.py --max-hit-rate 0.60

      - name: Pareto Metric Gate
        run: uv run python scripts/check_pareto_gate.py --baseline scripts/metrics_baseline.json --max-ood-hit-rate 0.60
